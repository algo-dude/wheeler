root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/wheeler"
  cmd = "go build -o ./tmp/wheeler ."
  delay = 1000
  exclude_dir = ["tmp", "vendor", "ibkr_service", ".venv", "data", "node_modules", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "html", "css", "js"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
